name: Update Prices

on:
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 20 ]; then
            echo "flag=--intraday" >> "$GITHUB_OUTPUT"
            echo "msg=intraday $(date -u +%Y-%m-%dT%H:%M)" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "msg=eod $(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/fetch-prices.js ${{ steps.mode.outputs.flag }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: update prices ${{ steps.mode.outputs.msg }}"
          git push
